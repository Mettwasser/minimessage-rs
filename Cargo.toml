[package]
name = "minimessage-rs"
version = "0.1.0"
edition = "2024"
license = "MIT OR GPL-3.0-or-later"
description = "minimessage text formatting for Pumpkin Minecraft server plugins"
repository = "https://github.com/Mettwasser/minimessage-rs"
homepage = "https://github.com/Mettwasser/minimessage-rs"

[features]
default = []
runtime = ["dep:minimessage-runtime"]

[dependencies]
minimessage-impl = { path = "./minimessage-impl", version = "0.1.0" }
minimessage-macro = { path = "./minimessage-macro", version = "0.1.0" }
minimessage-runtime = { path = "./minimessage-runtime", version = "0.1.0", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "parser"
harness = false

[workspace]
members = ["minimessage-macro", "minimessage-impl", "minimessage-runtime"]

[lints.clippy]
"missing_errors_doc" = "allow"
"pedantic" = { level = "warn", priority = -1 }
