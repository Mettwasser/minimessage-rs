[package]
name = "minimessage-impl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Core parser implementation for compile-time checked minimessage text formatting"
repository = "https://github.com/Mettwasser/minimessage-rs"
homepage = "https://github.com/Mettwasser/minimessage-rs"

[dependencies]
fastsnbt = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
